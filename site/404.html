<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page introuvable · Birostweb</title>
<style>
  :root{--paper:#E5E2D6;--ink:#231F20;--accent:#F0451E;--gray:#6E6A5F}
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px;text-align:center}
  .code{font-size:clamp(72px,18vw,140px);font-weight:800;line-height:1;letter-spacing:-.04em}
  .code span{color:var(--accent)}
  h1{font-size:clamp(20px,4vw,26px);margin:14px 0 8px}
  p{color:var(--gray);max-width:44ch;margin:0 auto 26px}
  a{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;padding:14px 26px;border-radius:10px}
  a:hover{background:#CE3711}
</style>
</head>
<body>
  <main>
    <div class="code">4<span>0</span>4</div>
    <h1>Cette page n'existe pas (ou plus).</h1>
    <p>Le lien est peut-être erroné. Revenons sur la page d'accueil.</p>
    <a href="/">Retour à l'accueil</a>
  </main>
</body>
</html>
